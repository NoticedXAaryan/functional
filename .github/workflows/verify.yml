name: Verify local application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: balsuraksha
          POSTGRES_PASSWORD: balsuraksha
          POSTGRES_DB: balsuraksha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U balsuraksha"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://balsuraksha:balsuraksha@localhost:5432/balsuraksha?sslmode=disable
      APP_MODE: demo
      NOTIFICATION_MODE: DISABLED
      STAFF_AUTH_MODE: demo
      SESSION_SECRET: synthetic-ci-only-secret-never-deploy-this-value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '**/go.sum'
      - run: go run ./cmd/migrate -path ../../db/migrations
        working-directory: services/api
      - run: go test ./... -count=1
        working-directory: services/api
      - run: go test ./... -count=1
        working-directory: services/worker
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, ops]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run build
        working-directory: apps/${{ matrix.app }}
