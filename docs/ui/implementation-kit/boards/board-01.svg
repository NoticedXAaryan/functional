orries me</text><rect x="490" y="540" width="350" height="64" rx="14" fill="#fff0e7"/><text x="506" y="569" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">I am worried about someone</text><rect x="490" y="616" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="506" y="645" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">I am not sure</text><rect x="490" y="810" width="350" height="62" rx="12" fill="#603b91"/><text x="506" y="846" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Next</text><text x="490" y="910" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text><text x="900" y="110" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C03 · /help/message</text><rect x="900" y="130" width="390" height="820" rx="24" fill="#fafbff"/><rect x="900" y="130" width="390" height="70" rx="24" fill="#ffffff"/><text x="920" y="172" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="1120" y="170" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="1210" y="170" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="920" y="244" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">What would you like us to</text><text x="920" y="278" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">know?</text><text x="920" y="318" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">Share as much or as little as you</text><text x="920" y="343" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">want.</text><rect x="920" y="388" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="936" y="417" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Type a message</text><rect x="920" y="464" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="936" y="493" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Record my voice</text><rect x="920" y="540" width="350" height="64" rx="14" fill="#fff0e7"/><text x="936" y="569" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Just ask for help</text><rect x="920" y="810" width="350" height="62" rx="12" fill="#603b91"/><text x="936" y="846" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Next</text><text x="920" y="910" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text><text x="40" y="980" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C04 · /help/replies</text><rect x="40" y="1000" width="390" height="820" rx="24" fill="#fafbff"/><rect x="40" y="1000" width="390" height="70" rx="24" fill="#ffffff"/><text x="60" y="1042" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="260" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="350" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="60" y="1114" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">Would you like messages</text><text x="60" y="1148" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">here?</text><text x="60" y="1188" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">We will not send notifications about</text><text x="60" y="1213" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">this conversation.</text><rect x="60" y="1258" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="76" y="1287" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Yes, when I come back</text><rect x="60" y="1334" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="76" y="1363" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Send this without replies</text><rect x="60" y="1680" width="350" height="62" rx="12" fill="#603b91"/><text x="76" y="1716" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Next</text><text x="60" y="1780" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text><text x="470" y="980" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C05 · /help/review</text><rect x="470" y="1000" width="390" height="820" rx="24" fill="#fafbff"/><rect x="470" y="1000" width="390" height="70" rx="24" fill="#ffffff"/><text x="490" y="1042" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="690" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="780" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="490" y="1114" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">Check what you are</text><text x="490" y="1148" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">sending</text><text x="490" y="1188" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">This goes to {operatorName}.</text><rect x="490" y="1233" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="506" y="1262" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Your choices — Change</text><rect x="490" y="1309" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="506" y="1338" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Your message — Change</text><rect x="490" y="1385" width="350" height="64" rx="14" fill="#fff0e7"/><text x="506" y="1414" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Your reply choice — Change</text><rect x="490" y="1680" width="350" height="62" rx="12" fill="#603b91"/><text x="506" y="1716" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Send to the support team</text><text x="490" y="1780" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text><text x="900" y="980" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C06 · /help/received</text><rect x="900" y="1000" width="390" height="820" rx="24" fill="#fafbff"/><rect x="900" y="1000" width="390" height="70" rx="24" fill="#ffffff"/><text x="920" y="1042" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="1120" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="1210" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="920" y="1114" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">Your message was</text><text x="920" y="1148" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">received.</text><text x="920" y="1188" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">It was saved for the team. They may</text><text x="920" y="1213" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">not have read it yet.</text><rect x="920" y="1258" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="936" y="1287" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">You choose how to come back</text><rect x="920" y="1334" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="936" y="1363"