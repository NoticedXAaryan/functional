14" fill="#f0eaf8"/><text x="76" y="1515" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Skip</text><rect x="60" y="1680" width="350" height="62" rx="12" fill="#603b91"/><text x="76" y="1716" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Continue</text><text x="60" y="1780" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text><text x="470" y="980" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C11 · /help/options</text><rect x="470" y="1000" width="390" height="820" rx="24" fill="#fafbff"/><rect x="470" y="1000" width="390" height="70" rx="24" fill="#ffffff"/><text x="490" y="1042" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="690" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="780" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="490" y="1114" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">Other ways to get help</text><text x="490" y="1154" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">Calling may appear in your phone’s</text><text x="490" y="1179" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">call history.</text><rect x="490" y="1224" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="506" y="1253" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Call 1098 for child support</text><rect x="490" y="1300" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="506" y="1329" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Call 112 for immediate danger</text><rect x="490" y="1680" width="350" height="62" rx="12" fill="#603b91"/><text x="506" y="1716" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Back to my message</text><text x="490" y="1780" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text><text x="900" y="980" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C12 · /privacy</text><rect x="900" y="1000" width="390" height="820" rx="24" fill="#fafbff"/><rect x="900" y="1000" width="390" height="70" rx="24" fill="#ffffff"/><text x="920" y="1042" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="1120" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="1210" y="1040" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="920" y="1114" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">You choose what to share</text><text x="920" y="1154" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">You do not need to give your name.</text><rect x="920" y="1199" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="936" y="1228" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Who can read or hear it</text><rect x="920" y="1275" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="936" y="1304" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">What stays on this device</text><rect x="920" y="1351" width="350" height="64" rx="14" fill="#fff0e7"/><text x="936" y="1380" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">How to leave and come back</text><rect x="920" y="1680" width="350" height="62" rx="12" fill="#603b91"/><text x="936" y="1716" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Back</text><text x="920" y="1780" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text></svg>