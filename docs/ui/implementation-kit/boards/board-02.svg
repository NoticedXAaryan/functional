<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1880" width="1320" height="1880"><rect x="0" y="0" width="1320" height="1880" rx="0" fill="#eae7f0"/><text x="40" y="45" font-family="Arial, sans-serif" font-size="26" fill="#603b91" font-weight="700">BAL SETU · SCREEN COMPOSITION REFERENCE</text><text x="40" y="78" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Design only · Use real state and data · Never reproduce instruction text as UI</text><text x="40" y="110" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C07 · /help/return-setup</text><rect x="40" y="130" width="390" height="820" rx="24" fill="#fafbff"/><rect x="40" y="130" width="390" height="70" rx="24" fill="#ffffff"/><text x="60" y="172" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="260" y="170" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="350" y="170" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="60" y="244" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">Choose how to come back</text><text x="60" y="284" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">Only save access on a device that is</text><text x="60" y="309" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">safe for you.</text><rect x="60" y="354" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="76" y="383" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Use this device again</text><rect x="60" y="430" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="76" y="459" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Use a return card</text><rect x="60" y="506" width="350" height="64" rx="14" fill="#fff0e7"/><text x="76" y="535" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Continue without saving access</text><rect x="60" y="810" width="350" height="62" rx="12" fill="#603b91"/><text x="76" y="846" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Continue</text><text x="60" y="910" font-family="Arial, sans-serif" font-size="15" fill="#603b91" font-weight="400">Other ways to get help</text><text x="470" y="110" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">C08 · /my-messages</text><rect x="470" y="130" width="390" height="820" rx="24" fill="#fafbff"/><rect x="470" y="130" width="390" height="70" rx="24" fill="#ffffff"/><text x="490" y="172" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="690" y="170" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="780" y="170" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="490" y="244" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">Open your messages</text><text x="490" y="284" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">Your words work with the key saved</text><text x="490" y="309" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">on this device.</text><rect x="490" y="354" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="506" y="383" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">First word</text><rect x="490" y="430" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="506" y="459" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Second word</text><rect x="490" y="506" width="350" height="64" rx="14" fill="#fff0e7"/><text x="506" y="535" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Third word</text><rec