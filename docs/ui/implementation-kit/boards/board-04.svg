<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1880" width="1320" height="1880"><rect x="0" y="0" width="1320" height="1880" rx="0" fill="#eae7f0"/><text x="40" y="45" font-family="Arial, sans-serif" font-size="26" fill="#603b91" font-weight="700">BAL SETU · SCREEN COMPOSITION REFERENCE</text><text x="40" y="78" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Design only · Use real state and data · Never reproduce instruction text as UI</text><text x="40" y="110" font-family="Arial, sans-serif" font-size="16" fill="#603b91" font-weight="700">A02 · /alerts/{id}</text><rect x="40" y="130" width="390" height="820" rx="24" fill="#fafbff"/><rect x="40" y="130" width="390" height="70" rx="24" fill="#ffffff"/><text x="60" y="172" font-family="Arial, sans-serif" font-size="22" fill="#603b91" font-weight="700">Bal Setu</text><text x="260" y="170" font-family="Arial, sans-serif" font-size="14" fill="#242238" font-weight="400">Language</text><text x="350" y="170" font-family="Arial, sans-serif" font-size="14" fill="#603b91" font-weight="700">Leave</text><text x="60" y="244" font-family="Arial, sans-serif" font-size="27" fill="#242238" font-weight="700">Read this alert</text><text x="60" y="284" font-family="Arial, sans-serif" font-size="17" fill="#595668" font-weight="400">Use the latest details shown here.</text><rect x="60" y="329" width="350" height="64" rx="14" fill="#f0eaf8"/><text x="76" y="358" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Reviewed details from API</text><rect x="60" y="405" width="350" height="64" rx="14" fill="#eaf3fc"/><text x="76" y="434" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Area and last seen time</text><rect x="60" y="481" width="350" height="64" rx="14" fill="#fff0e7"/><text x="76" y="510" font-family="Arial, sans-serif" font-size="17" fill="#242238" font-weight="400">Issuer and last updated time</text><rect x="60" y="810" width