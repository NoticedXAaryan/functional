services:
  # ── PostgreSQL 16 with PostGIS ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: balsuraksha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: balsuraksha
      POSTGRES_PASSWORD: balsuraksha
      POSTGRES_DB: balsuraksha
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balsuraksha -d balsuraksha"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis (optional — rate limiting / temp state) ──────────────────────
  redis:
    profiles: ["optional"]
    image: redis:7-alpine
    container_name: balsuraksha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Go API server ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: balsuraksha-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: ${APP_MODE:-demo}
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-DISABLED}
      SESSION_SECRET: ${SESSION_SECRET:-demo-only-signing-secret-change-before-real-use}
      DATABASE_URL: postgres://balsuraksha:balsuraksha@postgres:5432/balsuraksha?sslmode=disable
      MIGRATION_PATH: /app/db/migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Go background worker ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: balsuraksha-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_MODE: ${APP_MODE:-demo}
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-DISABLED}
      DATABASE_URL: postgres://balsuraksha:balsuraksha@postgres:5432/balsuraksha?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
